[package]
name = "fin"
description = "Fin desktop app (Tauri shell around fin-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "fin_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fin-core = { path = "../crates/fin-core" }
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
# The same versions wry uses, to reach WebView2 settings Tauri does not expose.
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-future = "0.3.2"
# DPAPI for the data key and Windows Hello for the app lock (Fin 2.7).
windows = { version = "0.62.2", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_WinRT",
] }
