[package]
name = "fin"
description = "Fin desktop app (Tauri shell around fin-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "fin_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fin-core = { path = "../crates/fin-core" }
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
# The same versions wry uses, to reach WebView2 settings Tauri does not expose.
webview2-com = "0.39.1"
windows-core = "0.62.2"
