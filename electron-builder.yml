appId: app.fin.desktop
productName: Fin
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
win:
  # Generated by scripts/make-icon.ps1 (also used for the installer and uninstaller)
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
publish: null
# English UI only: drop Chromium's other ~50 locale packs.
electronLanguages: [en-US, en-GB]
compression: maximum
